<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <meta name="description" content="QR code scanner and generator. Works offline." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="QR Tools" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <title>QR Tools</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<nav class="nav">
  <div class="wordmark">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
      <rect x="0.5" y="0.5" width="5" height="5" stroke="currentColor" stroke-width="1.2"/>
      <rect x="2" y="2" width="2" height="2" fill="currentColor"/>
      <rect x="8.5" y="0.5" width="5" height="5" stroke="currentColor" stroke-width="1.2"/>
      <rect x="10" y="2" width="2" height="2" fill="currentColor"/>
      <rect x="0.5" y="8.5" width="5" height="5" stroke="currentColor" stroke-width="1.2"/>
      <rect x="2" y="10" width="2" height="2" fill="currentColor"/>
      <rect x="8.5" y="8.5" width="2.2" height="2.2" fill="currentColor"/>
      <rect x="11.3" y="8.5" width="2.2" height="2.2" fill="currentColor"/>
      <rect x="8.5" y="11.3" width="2.2" height="2.2" fill="currentColor"/>
      <rect x="11.3" y="11.3" width="2.2" height="2.2" fill="currentColor"/>
    </svg>
    qr-tools
  </div>
  <div class="tabs">
    <button class="tab active" data-tab="scanner">Scanner</button>
    <button class="tab" data-tab="generator">Generator</button>
  </div>
</nav>

<!-- SCANNER -->
<div class="page active" id="page-scanner">

  <div class="pane left-pane">

    <div class="section-hdr">
      <span>Input</span>
      <span class="muted small">ctrl+v · drag · click</span>
    </div>

    <div class="drop-zone" id="dropZone" tabindex="0" role="button" aria-label="Drop image to scan">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <path d="M3 9h18M9 21V9"/>
        <rect x="5" y="5" width="3" height="3" fill="currentColor" stroke="none"/>
        <rect x="16" y="5" width="3" height="3" fill="currentColor" stroke="none"/>
        <rect x="5" y="16" width="3" height="3" fill="currentColor" stroke="none"/>
      </svg>
      <span class="drop-label">Drop image here</span>
      <div class="drop-actions">
        <button class="pill-btn" id="uploadBtn">Choose file</button>
        <button class="pill-btn" id="pasteBtn">Paste</button>
        <button class="pill-btn" id="cameraBtn">Camera</button>
      </div>
      <div class="drop-overlay">Release to scan</div>
    </div>

    <div class="preview-wrap" id="previewWrap" hidden>
      <img class="preview-img" id="previewImg" alt="" />
    </div>

    <div class="section-hdr" style="margin-top:4px">
      <span id="historyLabel">History</span>
      <button class="text-btn danger" id="clearAll" hidden>Clear all</button>
    </div>
    <div class="history-list" id="historyList">
      <div class="placeholder">No scans yet</div>
    </div>

  </div>

  <div class="pane right-pane">

    <div class="section-hdr">
      <span id="resultLabel">Result</span>
      <button class="text-btn" id="copyAll" hidden>Copy all</button>
    </div>

    <div class="result-area">
      <div class="placeholder tall" id="resultEmpty">Drop an image or paste to start</div>
      <div id="resultList"></div>
    </div>

  </div>
</div>

<!-- GENERATOR -->
<div class="page gen-page" id="page-generator">

  <div class="pane left-pane">

    <div class="section-hdr">
      <span>Content type</span>
      <select class="sel" id="genType">
        <option value="url">URL</option>
        <option value="text">Plain text</option>
        <option value="email">Email</option>
        <option value="phone">Phone</option>
        <option value="sms">SMS</option>
        <option value="wifi">WiFi</option>
        <option value="vcard">vCard / Contact</option>
        <option value="geo">Location</option>
        <option value="event">Calendar event</option>
        <option value="crypto">Crypto address</option>
      </select>
    </div>

    <div class="gen-scroll">

      <div id="fieldGroup" class="field-group"></div>

      <div class="divider-label">Appearance</div>

      <div class="color-block">
        <div class="color-row">
          <span class="lbl">Foreground</span>
          <div class="color-inputs">
            <div class="swatch" id="fgSwatch" style="background:#000000"></div>
            <input class="inp mono" id="fgHex" value="#000000" maxlength="9" spellcheck="false" />
            <input class="inp mono num" id="fgR" value="0"   maxlength="3" placeholder="R" />
            <input class="inp mono num" id="fgG" value="0"   maxlength="3" placeholder="G" />
            <input class="inp mono num" id="fgB" value="0"   maxlength="3" placeholder="B" />
          </div>
        </div>
        <div class="color-row">
          <span class="lbl">Background</span>
          <div class="color-inputs">
            <div class="swatch" id="bgSwatch" style="background:#ffffff"></div>
            <input class="inp mono" id="bgHex" value="#ffffff" maxlength="9" spellcheck="false" />
            <input class="inp mono num" id="bgR" value="255" maxlength="3" placeholder="R" />
            <input class="inp mono num" id="bgG" value="255" maxlength="3" placeholder="G" />
            <input class="inp mono num" id="bgB" value="255" maxlength="3" placeholder="B" />
          </div>
        </div>
      </div>

      <div class="opts-grid">
        <div class="opt-field">
          <label class="lbl">Error correction</label>
          <select class="sel" id="genEcc">
            <option value="L">L — 7%</option>
            <option value="M" selected>M — 15%</option>
            <option value="Q">Q — 25%</option>
            <option value="H">H — 30%</option>
          </select>
        </div>
        <div class="opt-field">
          <label class="lbl">Size (px)</label>
          <input class="inp mono" id="genSize" value="512" />
        </div>
        <div class="opt-field">
          <label class="lbl">Margin</label>
          <input class="inp mono" id="genMargin" value="4" />
        </div>
        <div class="opt-field">
          <label class="lbl">Corner radius (%)</label>
          <input class="inp mono" id="genRadius" value="0" placeholder="0–50" />
        </div>
        <div class="opt-field">
          <label class="lbl">Module style</label>
          <select class="sel" id="genModuleStyle">
            <option value="square">Square</option>
            <option value="round">Rounded</option>
            <option value="dots">Dots</option>
          </select>
        </div>
      </div>

      <div class="divider-label">
        Text labels
        <button class="pill-btn sm" id="addLabel">+ Add</button>
      </div>
      <div id="labelList" class="label-list"></div>

      <div class="divider-label">Export</div>
      <div class="export-row">
        <select class="sel" id="exportFormat">
          <option value="png">PNG</option>
          <option value="svg">SVG</option>
          <option value="webp">WEBP</option>
          <option value="jpeg">JPEG</option>
          <option value="bmp">BMP</option>
        </select>
        <button class="pill-btn" id="downloadBtn">Download</button>
        <button class="pill-btn accent" id="copyQR">Copy image</button>
      </div>
      <!-- iOS: long-press this image to save to camera roll -->
      <a class="ios-save-wrap" id="iosSaveWrap" hidden>
        <img id="iosSaveImg" alt="Long-press to save to camera roll" />
        <span class="ios-save-hint">Hold to save to camera roll</span>
      </a>

    </div>
  </div>

  <div class="pane gen-preview-pane">
    <div class="section-hdr">
      <span>Preview</span>
      <span class="muted small" id="genStatus">—</span>
    </div>
    <div class="gen-preview-area">
      <canvas id="genCanvas"></canvas>
      <div class="placeholder" id="genEmpty">Fill in content to generate</div>
    </div>
  </div>

</div>

<!-- Color picker -->

<div class="cpicker" id="colorPicker">
  <div class="cp-sv-wrap">
    <canvas id="cpSV" width="220" height="160"></canvas>
    <div class="cp-sv-cur" id="cpSVCursor"></div>
  </div>
  <div class="cp-strips">
    <canvas class="cp-strip" id="cpHue" width="220" height="16"></canvas>
    <div class="cp-strip-cur" id="cpHueCursor"></div>
    <canvas class="cp-strip" id="cpAlpha" width="220" height="16"></canvas>
    <div class="cp-strip-cur" id="cpAlphaCursor"></div>
  </div>
  <div class="cp-foot">
    <div class="cp-preview-swatch" id="cpPreview"></div>
    <span class="cp-hex-out mono" id="cpHexOut">#000000</span>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" multiple hidden />
<input type="file" id="cameraInput" accept="image/*" capture="environment" hidden />
<canvas id="qrCanvas" hidden></canvas>

<script src="jsQR.min.js"></script>
<script src="qrcodegen.js"></script>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
