<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#0f0f11" />
  <meta name="description" content="Fast, minimal QR code scanner. Drop an image, paste, or use your camera." />
  <title>QR Scanner</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="logo">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <rect x="1" y="1" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.5"/>
          <rect x="3" y="3" width="3" height="3" fill="currentColor"/>
          <rect x="12" y="1" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.5"/>
          <rect x="14" y="3" width="3" height="3" fill="currentColor"/>
          <rect x="1" y="12" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.5"/>
          <rect x="3" y="14" width="3" height="3" fill="currentColor"/>
          <rect x="12" y="12" width="3" height="3" fill="currentColor"/>
          <rect x="17" y="12" width="2" height="2" fill="currentColor"/>
          <rect x="12" y="17" width="2" height="2" fill="currentColor"/>
          <rect x="16" y="16" width="3" height="3" fill="currentColor"/>
        </svg>
        <span>QR Scanner</span>
      </div>
      <div class="header-actions">
        <button class="btn-ghost" id="historyToggle" title="Toggle history" aria-label="Toggle history panel">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.4"/>
            <path d="M8 4.5V8l2.5 2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>History</span>
          <span class="badge" id="historyBadge" hidden>0</span>
        </button>
        <button class="btn-ghost danger" id="clearAll" title="Clear all results" hidden>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M2 4h12M5 4V2.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 .5.5V4M6.5 7v5M9.5 7v5M3.5 4l.75 9.5a.5.5 0 0 0 .5.5h6.5a.5.5 0 0 0 .5-.5L12.5 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Clear all</span>
        </button>
      </div>
    </header>

    <main class="app-main">
      <div class="scanner-col">
        <!-- Drop zone -->
        <div class="drop-zone" id="dropZone" tabindex="0" role="button" aria-label="Drop images here, click to upload, or paste from clipboard">
          <div class="drop-inner" id="dropInner">
            <div class="drop-icon" aria-hidden="true">
              <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                <rect x="4" y="8" width="32" height="26" rx="3" stroke="currentColor" stroke-width="1.8"/>
                <path d="M14 22l5-5 4 4 3-3 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="13" cy="17" r="2.5" stroke="currentColor" stroke-width="1.5"/>
                <path d="M20 4v8M17 7l3-3 3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <p class="drop-primary">Drop images here</p>
            <p class="drop-secondary">or click to upload &middot; paste with Ctrl+V</p>
            <div class="drop-actions">
              <button class="btn-accent" id="uploadBtn" type="button">Choose files</button>
              <button class="btn-outline" id="cameraBtn" type="button">
                <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
                  <path d="M1.5 5.5a1 1 0 0 1 1-1h1.382a1 1 0 0 0 .894-.553l.447-.894A1 1 0 0 1 6.118 2.5h2.764a1 1 0 0 1 .894.553l.447.894A1 1 0 0 0 11.118 4.5H12.5a1 1 0 0 1 1 1V12a1 1 0 0 1-1 1h-10a1 1 0 0 1-1-1V5.5z" stroke="currentColor" stroke-width="1.3"/>
                  <circle cx="7.5" cy="8.5" r="2" stroke="currentColor" stroke-width="1.3"/>
                </svg>
                Camera
              </button>
            </div>
          </div>
          <div class="drop-overlay" id="dropOverlay" aria-hidden="true">
            <span>Release to scan</span>
          </div>
        </div>

        <!-- Hidden inputs -->
        <input type="file" id="fileInput" accept="image/*" multiple hidden />
        <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden />

        <!-- Processing indicator -->
        <div class="processing" id="processing" hidden>
          <div class="spinner" aria-hidden="true"></div>
          <span id="processingText">Scanning...</span>
        </div>

        <!-- Results -->
        <div class="results" id="results" hidden>
          <div class="results-header">
            <span class="results-label" id="resultsLabel">Results</span>
            <button class="btn-ghost sm" id="copyAll" title="Copy all results to clipboard">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                <rect x="4.5" y="4.5" width="8" height="8" rx="1" stroke="currentColor" stroke-width="1.3"/>
                <path d="M9.5 4.5V3a.5.5 0 0 0-.5-.5H2.5A.5.5 0 0 0 2 3v6.5a.5.5 0 0 0 .5.5H4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
              </svg>
              Copy all
            </button>
          </div>
          <div class="result-list" id="resultList"></div>
        </div>

        <!-- History panel -->
        <div class="history-panel" id="historyPanel" hidden>
          <div class="history-header">
            <span>Scan history (this session)</span>
            <button class="btn-ghost sm icon-only" id="historyClose" aria-label="Close history">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                <path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <div class="history-list" id="historyList">
            <p class="empty-state">No scans yet.</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Hidden canvas for QR decoding -->
  <canvas id="qrCanvas" hidden aria-hidden="true"></canvas>

  <script src="jsQR.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
